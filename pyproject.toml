[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "vectorless"
version = "0.1.11"
description = "Reasoning-based Document Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "vectorless developers", email = "beautifularea@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["rag", "document", "retrieval", "llm", "document-intelligence"]

dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "rich>=13.0",
]
cli = [
    "rich>=13.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
jupyter = [
    "rich>=13.0",
    "ipywidgets>=8.0",
]
all = [
    "vectorless[cli,langchain,llamaindex,jupyter]",
]

[project.scripts]
vectorless = "vectorless.cli.main:app"

[project.urls]
Homepage = "https://vectorless.dev"
Repository = "https://github.com/vectorlessflow/vectorless"
Documentation = "https://www.vectorless.dev/docs/intro"

[tool.maturin]
python-source = "python"
module-name = "vectorless._vectorless"
manifest-path = "python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python/tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
