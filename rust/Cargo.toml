[package]
name = "vectorless"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Hierarchical, reasoning-native document intelligence engine"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vectorless"
keywords = ["rag", "document", "retrieval", "indexing", "llm"]
categories = ["text-processing", "data-structures", "algorithms"]
readme = "../README.md"
exclude = ["docs/", ".*"]

# Example directory configuration
[[example]]
name = "advanced"
path = "../examples/rust/advanced.rs"

[[example]]
name = "events"
path = "../examples/rust/events.rs"

[[example]]
name = "flow"
path = "../examples/rust/flow.rs"

[[example]]
name = "graph"
path = "../examples/rust/graph.rs"

[[example]]
name = "indexing"
path = "../examples/rust/indexing.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }

# OpenAI-compatible API client
async-openai = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Rate limiting
governor = { workspace = true }
nonzero_ext = { workspace = true }

# Token counting
tiktoken-rs = { workspace = true }

# Text processing
regex = { workspace = true }

# Markdown parsing
pulldown-cmark = { workspace = true }

# Tree data structure
indextree = { workspace = true }

# LRU cache
lru = { workspace = true }

# Checksum
sha2 = { workspace = true }

# BLAKE2b hashing
blake2 = { workspace = true }
base64 = { workspace = true }

# Synchronization primitives
parking_lot = { workspace = true }

# Compression
flate2 = { workspace = true }

# File locking (Unix)
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# PDF processing
pdf-extract = { workspace = true }
lopdf = { workspace = true }

# Random number generation
rand = { workspace = true }

# BM25 scoring
bm25 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
