[package]
name = "vectorless"
version = "0.1.4"
edition = "2024"
authors = ["zTgx <beautifularea@gmail.com>"]
description = "Hierarchical, reasoning-native document intelligence engine"
license = "Apache-2.0"
repository = "https://github.com/vectorlessflow/vectorless"
keywords = ["rag", "document", "retrieval", "indexing", "llm"]
categories = ["text-processing", "data-structures", "algorithms"]
readme = "README.md"
exclude = ["samples/", "docs/"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2"

# OpenAI-compatible API client
async-openai = { version = "0.34", features = ["chat-completion"]}

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Logging
tracing = "0.1"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Token counting
tiktoken-rs = "0.9"

# Text processing
regex = "1.10"

# Tree data structure
indextree = { version = "4.8.0", features = ["deser"] }

# LRU cache
lru = "0.12"

# PDF processing
pdf-extract = "0.10.0"
lopdf = "0.34"

# Random number generation (for sampling)
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
