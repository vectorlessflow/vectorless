[workspace]
members = [
    "crates/vectorless-error",
    "crates/vectorless-document",
    "crates/vectorless-config",
    "crates/vectorless-utils",
    "crates/vectorless-scoring",
    "crates/vectorless-graph",
    "crates/vectorless-events",
    "crates/vectorless-metrics",
    "crates/vectorless-llm",
    "crates/vectorless-storage",
    "crates/vectorless-compiler",
    "crates/vectorless-primitives",
    "crates/vectorless-engine",
    "crates/vectorless-py",
]
resolver = "2"

[workspace.package]
version = "0.1.12"
description = "Knowing by reasoning, not vectors."
edition = "2024"
authors = ["zTgx <beautifularea@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vectorlessflow/vectorless"
homepage = "https://vectorless.dev"
documentation = "https://docs.rs/vectorless"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2"
anyhow = "1"

# OpenAI-compatible API client
async-openai = { version = "0.34", features = ["chat-completion"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Logging
tracing = { version = "0.1", features = ["attributes"] }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Token counting
tiktoken-rs = "0.9"

# Text processing
regex = "1.10"

# Markdown parsing
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }

# Tree data structure
indextree = { version = "4.8.0", features = ["deser"] }

# LRU cache
lru = "0.12"

# Checksum
sha2 = "0.10"

# BLAKE2b hashing
blake2 = "0.10"
base64 = "0.22"

# Synchronization primitives
parking_lot = "0.12"

# Compression
flate2 = "1.0"

# File locking (Unix)
libc = "0.2"

# PDF processing
pdf-extract = "0.10.0"
lopdf = "0.34"

# Random number generation
rand = "0.8"

# BM25 scoring
bm25 = { version = "2.3.2", features = ["parallelism"] }

# Python bindings
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }

# Dev dependencies
tempfile = "3.10"
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Profile settings (must be at root level, not under workspace)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
debug = true

[profile.release.package."*"]
opt-level = 3
