# .rustfmt.toml

# Merge imports from the same crate
imports_granularity = "Crate"

# Group imports: stdlib / external crates / current crate
group_imports = "StdExternalCrate"

# Try horizontal layout first, fall back to vertical if too long
imports_layout = "HorizontalVertical"

# Sort import items
reorder_imports = true

# Use the new edition formatting style
edition = "2021"

# Maximum line width
max_width = 100

# Indent style for imports (keep default)
imports_indent = "Block"

# Maximum number of blank lines (keep default)
blank_lines_upper_bound = 1