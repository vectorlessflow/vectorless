<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Logo mark -->
  <g transform="translate(20, 10)">
    <!-- V shape -->
    <path d="M 15 15 L 50 50 L 50 48 L 18 18 Z" fill="url(#logoGradient)"/>
    <path d="M 85 15 L 50 50 L 50 48 L 82 18 Z" fill="url(#logoGradient)"/>

    <!-- Nodes -->
    <circle cx="15" cy="15" r="6" fill="url(#logoGradient)"/>
    <circle cx="85" cy="15" r="6" fill="url(#logoGradient)"/>
    <circle cx="50" cy="50" r="7" fill="url(#logoGradient)"/>

    <!-- Navigation path -->
    <path d="M 50 50 L 35 70 L 25 90"
          stroke="url(#pathGradient)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
    <circle cx="25" cy="90" r="4" fill="url(#pathGradient)"/>

    <!-- Branch hints -->
    <line x1="35" y1="35" x2="25" y2="28" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="65" y1="35" x2="75" y2="28" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="25" cy="28" r="2" fill="#60a5fa"/>
    <circle cx="75" cy="28" r="2" fill="#60a5fa"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="600" fill="#1e293b">Vectorless</text>

  <!-- Tagline -->
  <text x="130" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">Reasoning-Native Document Intelligence</text>
</svg>
