<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="350" fill="#fafafa"/>

  <!-- Traditional RAG Side -->
  <rect x="20" y="20" width="370" height="310" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="205" y="50" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">Traditional RAG</text>

  <!-- Document -->
  <rect x="40" y="70" width="100" height="130" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="90" y="90" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Document</text>
  <rect x="50" y="100" width="80" height="12" rx="2" fill="#d1d5db"/>
  <rect x="50" y="118" width="80" height="12" rx="2" fill="#d1d5db"/>
  <rect x="50" y="136" width="80" height="12" rx="2" fill="#d1d5db"/>
  <rect x="50" y="154" width="80" height="12" rx="2" fill="#d1d5db"/>
  <rect x="50" y="172" width="60" height="12" rx="2" fill="#d1d5db"/>

  <!-- Arrow -->
  <path d="M 145 135 L 165 135" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="155" y="125" font-size="8" fill="#dc2626">chunk</text>

  <!-- Chunks -->
  <rect x="170" y="80" width="50" height="25" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <rect x="170" y="110" width="50" height="25" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <rect x="170" y="140" width="50" height="25" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <rect x="170" y="170" width="50" height="25" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="195" y="210" font-size="9" fill="#991b1b" text-anchor="middle">Chunks</text>

  <!-- Arrow to vectors -->
  <path d="M 225 135 L 245 135" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="235" y="125" font-size="8" fill="#dc2626">embed</text>

  <!-- Vector DB -->
  <rect x="250" y="70" width="120" height="140" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="310" y="95" font-size="10" font-weight="600" fill="#991b1b" text-anchor="middle">Vector DB</text>
  <text x="260" y="115" font-size="8" fill="#7f1d1d">[0.12, 0.45, ...]</text>
  <text x="260" y="130" font-size="8" fill="#7f1d1d">[0.33, 0.21, ...]</text>
  <text x="260" y="145" font-size="8" fill="#7f1d1d">[0.87, 0.03, ...]</text>
  <text x="260" y="160" font-size="8" fill="#7f1d1d">[0.56, 0.78, ...]</text>
  <text x="260" y="175" font-size="8" fill="#7f1d1d">...</text>

  <!-- Result -->
  <rect x="260" y="220" width="110" height="50" rx="6" fill="white" stroke="#f87171" stroke-width="1"/>
  <text x="315" y="240" font-size="9" font-weight="500" fill="#991b1b" text-anchor="middle">Result</text>
  <text x="270" y="258" font-size="8" fill="#6b7280">Fragment #47</text>
  <text x="270" y="270" font-size="7" fill="#9ca3af">(no context)</text>

  <!-- Arrow to result -->
  <path d="M 310 210 L 315 218" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Problems -->
  <text x="205" y="300" font-size="9" fill="#991b1b" text-anchor="middle">❌ Structure lost</text>
  <text x="205" y="315" font-size="9" fill="#991b1b" text-anchor="middle">❌ No context</text>

  <!-- Divider -->
  <line x1="400" y1="40" x2="400" y2="310" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- VS -->
  <circle cx="400" cy="175" r="20" fill="#1e293b"/>
  <text x="400" y="180" font-size="12" font-weight="700" fill="white" text-anchor="middle">vs</text>

  <!-- Vectorless Side -->
  <rect x="410" y="20" width="370" height="310" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="595" y="50" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Vectorless</text>

  <!-- Document Tree -->
  <rect x="430" y="70" width="100" height="140" rx="6" fill="white" stroke="#86efac" stroke-width="1.5"/>
  <text x="480" y="90" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Document</text>

  <!-- Tree structure -->
  <rect x="445" y="100" width="70" height="18" rx="3" fill="#22c55e"/>
  <text x="480" y="113" font-size="8" fill="white" text-anchor="middle">Root</text>

  <rect x="455" y="125" width="55" height="15" rx="3" fill="#4ade80"/>
  <text x="482" y="136" font-size="7" fill="white" text-anchor="middle">Ch.1</text>

  <rect x="455" y="145" width="55" height="15" rx="3" fill="#4ade80"/>
  <text x="482" y="156" font-size="7" fill="white" text-anchor="middle">Ch.2</text>

  <rect x="465" y="165" width="40" height="12" rx="2" fill="#86efac"/>
  <text x="485" y="174" font-size="6" fill="#166534" text-anchor="middle">2.1</text>

  <rect x="465" y="180" width="40" height="12" rx="2" fill="#86efac"/>
  <text x="485" y="189" font-size="6" fill="#166534" text-anchor="middle">2.2</text>

  <!-- Arrow to LLM -->
  <path d="M 535 140 L 555 140" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="545" y="130" font-size="8" fill="#166534">query</text>

  <!-- LLM Navigator -->
  <rect x="560" y="80" width="100" height="120" rx="8" fill="#1e293b"/>
  <text x="610" y="105" font-size="10" font-weight="600" fill="white" text-anchor="middle">LLM</text>
  <text x="610" y="120" font-size="8" fill="#9ca3af" text-anchor="middle">Navigator</text>

  <rect x="575" y="135" width="70" height="20" rx="3" fill="#374151"/>
  <text x="610" y="149" font-size="7" fill="#a7f3d0" text-anchor="middle">"Ch.2 looks right"</text>

  <rect x="575" y="160" width="70" height="20" rx="3" fill="#374151"/>
  <text x="610" y="174" font-size="7" fill="#a7f3d0" text-anchor="middle">"Try section 2.1"</text>

  <!-- Arrow to result -->
  <path d="M 660 140 L 680 140" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Result -->
  <rect x="685" y="90" width="80" height="100" rx="6" fill="white" stroke="#22c55e" stroke-width="2"/>
  <text x="725" y="110" font-size="9" font-weight="600" fill="#166534" text-anchor="middle">Result</text>
  <text x="695" y="130" font-size="8" fill="#15803d">Section 2.1</text>
  <text x="695" y="145" font-size="7" fill="#6b7280">+ parent context</text>
  <text x="695" y="160" font-size="7" fill="#6b7280">+ sibling context</text>
  <text x="695" y="180" font-size="7" fill="#9ca3af">traceable path</text>

  <!-- Benefits -->
  <text x="595" y="300" font-size="9" fill="#166534" text-anchor="middle">✓ Structure preserved</text>
  <text x="595" y="315" font-size="9" fill="#166534" text-anchor="middle">✓ Full context</text>

  <!-- Infrastructure labels -->
  <rect x="40" y="280" width="330" height="35" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="205" y="295" font-size="8" fill="#991b1b" text-anchor="middle">Infrastructure: Vector DB + Embedding Model + Chunking Strategy</text>
  <text x="205" y="307" font-size="7" fill="#b91c1c" text-anchor="middle">Setup time: Hours to Days</text>

  <rect x="430" y="280" width="330" height="35" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="595" y="295" font-size="8" fill="#166534" text-anchor="middle">Infrastructure: Just an LLM API</text>
  <text x="595" y="307" font-size="7" fill="#15803d" text-anchor="middle">Setup time: Minutes</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
