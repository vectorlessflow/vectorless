<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="800" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="30" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Vectorless Architecture</text>

  <!-- Engine Client Container -->
  <rect x="20" y="50" width="860" height="730" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="80" font-size="14" font-weight="600" fill="#1e293b">Engine Client</text>

  <!-- Config Box -->
  <rect x="40" y="100" width="180" height="90" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="130" y="125" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Config (TOML)</text>
  <text x="50" y="145" font-size="9" fill="#78350f">• LLM pool settings</text>
  <text x="50" y="158" font-size="9" fill="#78350f">• Metrics config</text>
  <text x="50" y="171" font-size="9" fill="#78350f">• Pilot + feedback</text>
  <text x="50" y="184" font-size="9" fill="#78350f">• Scoring strategy</text>

  <!-- Workspace Box -->
  <rect x="40" y="200" width="180" height="85" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="130" y="225" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Workspace</text>
  <text x="50" y="245" font-size="9" fill="#1e3a8a">• Persistence (JSON)</text>
  <text x="50" y="258" font-size="9" fill="#1e3a8a">• LRU Cache</text>
  <text x="50" y="271" font-size="9" fill="#1e3a8a">• Feedback Store</text>

  <!-- Index Pipeline Container -->
  <rect x="250" y="100" width="390" height="130" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="445" y="125" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">Index Pipeline</text>

  <!-- Index Pipeline Stages -->
  <rect x="265" y="140" width="55" height="45" rx="4" fill="#22c55e"/>
  <text x="292" y="160" font-size="9" fill="white" text-anchor="middle">Parse</text>
  <text x="292" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">MD/PDF</text>

  <path d="M 320 162 L 335 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="340" y="140" width="55" height="45" rx="4" fill="#22c55e"/>
  <text x="367" y="160" font-size="9" fill="white" text-anchor="middle">Build</text>
  <text x="367" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">Tree</text>

  <path d="M 395 162 L 410 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="415" y="140" width="55" height="45" rx="4" fill="#16a34a"/>
  <text x="442" y="155" font-size="9" fill="white" text-anchor="middle">Enhance</text>
  <text x="442" y="168" font-size="8" fill="#dcfce7" text-anchor="middle">ToC</text>
  <text x="442" y="180" font-size="8" fill="#dcfce7" text-anchor="middle">Sections</text>

  <path d="M 470 162 L 485 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="490" y="140" width="55" height="45" rx="4" fill="#16a34a"/>
  <text x="517" y="155" font-size="9" fill="white" text-anchor="middle">Enrich</text>
  <text x="517" y="168" font-size="8" fill="#dcfce7" text-anchor="middle">LLM</text>
  <text x="517" y="180" font-size="8" fill="#dcfce7" text-anchor="middle">Summary</text>

  <path d="M 545 162 L 560 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="565" y="140" width="60" height="45" rx="4" fill="#22c55e"/>
  <text x="595" y="160" font-size="9" fill="white" text-anchor="middle">Optimize</text>
  <text x="595" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">Thin</text>

  <!-- Retrieval Pipeline Container -->
  <rect x="250" y="250" width="610" height="280" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="555" y="275" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Retrieval Pipeline</text>

  <!-- Pipeline Stages Row -->
  <rect x="270" y="295" width="120" height="55" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="330" y="318" font-size="10" font-weight="500" fill="#7f1d1d" text-anchor="middle">Analyze</text>
  <text x="280" y="338" font-size="8" fill="#dc2626">• Complexity detect</text>
  <text x="280" y="348" font-size="8" fill="#dc2626">• Decompose query</text>

  <path d="M 390 322 L 410 322" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="415" y="295" width="120" height="55" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="475" y="318" font-size="10" font-weight="500" fill="#7f1d1d" text-anchor="middle">Plan</text>
  <text x="425" y="338" font-size="8" fill="#dc2626">• Strategy select</text>
  <text x="425" y="348" font-size="8" fill="#dc2626">• Algorithm config</text>

  <path d="M 535 322 L 555 322" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="560" y="295" width="120" height="55" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="620" y="318" font-size="10" font-weight="500" fill="#7f1d1d" text-anchor="middle">Search</text>
  <text x="570" y="338" font-size="8" fill="#dc2626">• Tree traversal</text>
  <text x="570" y="348" font-size="8" fill="#dc2626">• Pilot guidance</text>

  <path d="M 680 322 L 700 322" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="705" y="295" width="135" height="55" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="772" y="318" font-size="10" font-weight="500" fill="#7f1d1d" text-anchor="middle">Judge</text>
  <text x="715" y="338" font-size="8" fill="#dc2626">• Sufficiency check</text>
  <text x="715" y="348" font-size="8" fill="#dc2626">• Backtrack control</text>

  <!-- Scoring Section -->
  <text x="270" y="375" font-size="10" font-weight="600" fill="#991b1b">Scoring Strategies:</text>

  <rect x="270" y="385" width="180" height="60" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="360" y="407" font-size="10" font-weight="500" fill="#c2410c" text-anchor="middle">Keyword Only</text>
  <text x="280" y="425" font-size="8" fill="#9a3412">• TF-IDF overlap</text>
  <text x="280" y="438" font-size="8" fill="#9a3412">• Fast, no API calls</text>

  <rect x="465" y="385" width="180" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="555" y="407" font-size="10" font-weight="500" fill="#1e40af" text-anchor="middle">BM25</text>
  <text x="475" y="425" font-size="8" fill="#1e3a8a">• IDF + TF normalization</text>
  <text x="475" y="438" font-size="8" fill="#1e3a8a">• Better relevance</text>

  <rect x="660" y="385" width="180" height="60" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="750" y="407" font-size="10" font-weight="500" fill="#166534" text-anchor="middle">Hybrid (Default)</text>
  <text x="670" y="425" font-size="8" fill="#15803d">• 40% keyword + 60% BM25</text>
  <text x="670" y="438" font-size="8" fill="#15803d">• Best balance</text>

  <!-- Query Decomposition -->
  <rect x="270" y="455" width="285" height="60" rx="6" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="412" y="477" font-size="10" font-weight="500" fill="#6b21a8" text-anchor="middle">Query Decomposition</text>
  <text x="280" y="495" font-size="8" fill="#7e22ce">• Split complex queries into sub-queries</text>
  <text x="280" y="508" font-size="8" fill="#7e22ce">• Execute in dependency order</text>

  <!-- Pilot + Feedback Learning -->
  <rect x="565" y="455" width="275" height="60" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="702" y="477" font-size="10" font-weight="500" fill="#047857" text-anchor="middle">Pilot + Feedback Learning</text>
  <text x="575" y="495" font-size="8" fill="#065f46">• LLM-guided navigation</text>
  <text x="575" y="508" font-size="8" fill="#065f46">• Learns from user feedback</text>

  <!-- LLM Executor (external) -->
  <rect x="660" y="100" width="200" height="100" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
  <text x="760" y="125" font-size="11" font-weight="600" fill="white" text-anchor="middle">LLM Executor</text>
  <text x="670" y="145" font-size="9" fill="#9ca3af">• Throttle control</text>
  <text x="670" y="158" font-size="9" fill="#9ca3af">• Retry with backoff</text>
  <text x="670" y="171" font-size="9" fill="#9ca3af">• Fallback chain</text>
  <text x="670" y="184" font-size="9" fill="#9ca3af">• Unified metrics</text>

  <!-- Unified Metrics Hub -->
  <rect x="40" y="555" width="820" height="100" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="450" y="580" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">Unified Metrics Hub</text>

  <rect x="60" y="595" width="180" height="50" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="150" y="615" font-size="10" font-weight="500" fill="#166534" text-anchor="middle">LLM Metrics</text>
  <text x="70" y="635" font-size="8" fill="#15803d">calls • tokens • latency • cost</text>

  <rect x="260" y="595" width="180" height="50" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="350" y="615" font-size="10" font-weight="500" fill="#1e40af" text-anchor="middle">Pilot Metrics</text>
  <text x="270" y="635" font-size="8" fill="#1e3a8a">decisions • confidence • accuracy</text>

  <rect x="460" y="595" width="180" height="50" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="550" y="615" font-size="10" font-weight="500" fill="#92400e" text-anchor="middle">Retrieval Metrics</text>
  <text x="470" y="635" font-size="8" fill="#78350f">paths • scores • cache hits</text>

  <rect x="660" y="595" width="180" height="50" rx="4" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
  <text x="750" y="615" font-size="10" font-weight="500" fill="#6b21a8" text-anchor="middle">Feedback Stats</text>
  <text x="670" y="635" font-size="8" fill="#7e22ce">accuracy • samples • trends</text>

  <!-- Backtracking Arrow -->
  <path d="M 772 350 L 772 365 L 330 365 L 330 350" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="550" y="378" font-size="8" fill="#dc2626" text-anchor="middle">NeedMoreData / Backtrack</text>

  <!-- Feedback Loop -->
  <path d="M 702 515 L 702 540 L 130 540 L 130 545" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-green)"/>
  <text x="400" y="535" font-size="8" fill="#166534" text-anchor="middle">Feedback Loop: User feedback → Store → Learner → Adjusted decisions</text>

  <!-- LLM connections -->
  <path d="M 760 200 L 760 250" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 660 150 L 530 150" stroke="#374151" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>

  <!-- Design Philosophy -->
  <rect x="40" y="670" width="820" height="95" rx="8" fill="#1e293b"/>
  <text x="450" y="695" font-size="11" font-weight="600" fill="white" text-anchor="middle">Design Philosophy</text>

  <text x="150" y="720" font-size="10" fill="#9ca3af" text-anchor="middle">Zero Vectors</text>
  <text x="150" y="735" font-size="9" fill="#6b7280" text-anchor="middle">No embedding model</text>
  <text x="150" y="750" font-size="9" fill="#6b7280" text-anchor="middle">LLM-powered navigation</text>

  <text x="350" y="720" font-size="10" fill="#9ca3af" text-anchor="middle">Algorithm + LLM</text>
  <text x="350" y="735" font-size="9" fill="#6b7280" text-anchor="middle">Efficient + Semantic</text>
  <text x="350" y="750" font-size="9" fill="#6b7280" text-anchor="middle">Hybrid scoring</text>

  <text x="550" y="720" font-size="10" fill="#9ca3af" text-anchor="middle">Feedback Learning</text>
  <text x="550" y="735" font-size="9" fill="#6b7280" text-anchor="middle">Continuous improvement</text>
  <text x="550" y="750" font-size="9" fill="#6b7280" text-anchor="middle">Context-aware adjustments</text>

  <text x="750" y="720" font-size="10" fill="#9ca3af" text-anchor="middle">Multi-turn Support</text>
  <text x="750" y="735" font-size="9" fill="#6b7280" text-anchor="middle">Query decomposition</text>
  <text x="750" y="750" font-size="9" fill="#6b7280" text-anchor="middle">Dependency ordering</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
