<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="30" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Vectorless Architecture</text>

  <!-- Vectorless Client Container -->
  <rect x="20" y="50" width="860" height="550" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="80" font-size="14" font-weight="600" fill="#1e293b">Vectorless Client</text>

  <!-- Config Box -->
  <rect x="40" y="100" width="180" height="70" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="130" y="125" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Config</text>
  <text x="50" y="145" font-size="9" fill="#78350f">• indexer settings</text>
  <text x="50" y="158" font-size="9" fill="#78350f">• summary/retrieval LLM</text>

  <!-- Workspace Box -->
  <rect x="40" y="185" width="180" height="85" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="130" y="210" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Workspace</text>
  <text x="50" y="230" font-size="9" fill="#1e3a8a">• Persistence (JSON)</text>
  <text x="50" y="243" font-size="9" fill="#1e3a8a">• LRU Cache</text>
  <text x="50" y="256" font-size="9" fill="#1e3a8a">• Document Metadata</text>

  <!-- Index Pipeline Container -->
  <rect x="250" y="100" width="390" height="170" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="445" y="125" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">Index Pipeline</text>

  <!-- Pipeline Stages -->
  <rect x="265" y="140" width="55" height="45" rx="4" fill="#22c55e"/>
  <text x="292" y="160" font-size="9" fill="white" text-anchor="middle">Parse</text>
  <text x="292" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">MD/PDF</text>

  <path d="M 320 162 L 335 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="340" y="140" width="55" height="45" rx="4" fill="#22c55e"/>
  <text x="367" y="160" font-size="9" fill="white" text-anchor="middle">Build</text>
  <text x="367" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">Tree</text>

  <path d="M 395 162 L 410 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="415" y="140" width="55" height="45" rx="4" fill="#16a34a"/>
  <text x="442" y="155" font-size="9" fill="white" text-anchor="middle">Enhance</text>
  <text x="442" y="168" font-size="8" fill="#dcfce7" text-anchor="middle">LLM</text>
  <text x="442" y="180" font-size="8" fill="#dcfce7" text-anchor="middle">Summary</text>

  <path d="M 470 162 L 485 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="490" y="140" width="55" height="45" rx="4" fill="#22c55e"/>
  <text x="517" y="160" font-size="9" fill="white" text-anchor="middle">Enrich</text>
  <text x="517" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">Meta</text>

  <path d="M 545 162 L 560 162" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="565" y="140" width="60" height="45" rx="4" fill="#22c55e"/>
  <text x="595" y="160" font-size="9" fill="white" text-anchor="middle">Optimize</text>
  <text x="595" y="175" font-size="8" fill="#dcfce7" text-anchor="middle">Thin</text>

  <!-- Persist arrow -->
<!--   <path d="M 595 185 L 595 205 L 130 205 L 130 270" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <text x="350" y="218" font-size="8" fill="#3b82f6">Persist</text> -->

  <!-- Adaptive Retriever Container -->
  <rect x="250" y="290" width="610" height="290" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="555" y="315" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Adaptive Retriever</text>

  <!-- Complexity Detector -->
  <rect x="270" y="330" width="570" height="50" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="555" y="352" font-size="10" font-weight="500" fill="#7f1d1d" text-anchor="middle">Complexity Detector</text>
  <text x="320" y="370" font-size="9" fill="#dc2626">Simple</text>
  <text x="555" y="370" font-size="9" fill="#dc2626" text-anchor="middle">Medium</text>
  <text x="790" y="370" font-size="9" fill="#dc2626" text-anchor="end">Complex</text>

  <!-- Strategy arrows -->
  <path d="M 555 380 L 555 395" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Strategies -->
  <rect x="270" y="400" width="170" height="70" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="355" y="422" font-size="10" font-weight="500" fill="#c2410c" text-anchor="middle">Keyword Strategy</text>
  <text x="280" y="440" font-size="8" fill="#9a3412">• TF-IDF / BM25</text>
  <text x="280" y="455" font-size="8" fill="#9a3412">• No API calls</text>

  <rect x="460" y="400" width="170" height="70" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5"/>
  <text x="545" y="422" font-size="10" font-weight="500" fill="#86198f" text-anchor="middle">Semantic Strategy</text>
  <text x="470" y="440" font-size="8" fill="#701a75">• Embedding similarity</text>
  <text x="470" y="455" font-size="8" fill="#701a75">• Vector comparison</text>

  <rect x="650" y="400" width="190" height="70" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="745" y="422" font-size="10" font-weight="500" fill="#047857" text-anchor="middle">LLM Strategy</text>
  <text x="660" y="440" font-size="8" fill="#065f46">• ToC View navigation</text>
  <text x="660" y="455" font-size="8" fill="#065f46">• Beam search + judge</text>

  <!-- Search methods arrow -->
  <path d="M 555 470 L 555 485" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Multi-Path Search -->
  <rect x="270" y="490" width="570" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="555" y="512" font-size="10" font-weight="500" fill="#991b1b" text-anchor="middle">Multi-Path Search: Greedy | Beam Search | MCTS</text>

  <!-- Sufficiency arrow -->
  <path d="M 555 530 L 555 545" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Sufficiency Checker -->
  <rect x="370" y="550" width="370" height="25" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="555" y="567" font-size="9" fill="#991b1b" text-anchor="middle">Sufficiency Checker: Threshold | LLM Judge</text>

  <!-- LLM Client (external) -->
  <rect x="660" y="100" width="200" height="85" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
  <text x="760" y="125" font-size="11" font-weight="600" fill="white" text-anchor="middle">LLM Client</text>
  <text x="670" y="145" font-size="9" fill="#9ca3af">• Retry with backoff</text>
  <text x="670" y="158" font-size="9" fill="#9ca3af">• Fallback chain</text>
  <text x="670" y="171" font-size="9" fill="#9ca3af">• Concurrency control</text>

  <!-- LLM connections -->
  <path d="M 760 185 L 760 400" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 660 142 L 470 142" stroke="#374151" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>

  <!-- Query flow arrow from Workspace to Retriever -->
<!--   <path d="M 130 270 L 130 435 L 265 435" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="140" y="350" font-size="8" fill="#3b82f6">Load</text>
  <text x="140" y="360" font-size="8" fill="#3b82f6">Tree</text> -->

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
