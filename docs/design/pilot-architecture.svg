<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="680" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="28" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Pilot: The Brain of Retrieval Pipeline</text>

  <!-- Main Pipeline Row -->
  <rect x="20" y="50" width="860" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="75" font-size="12" font-weight="600" fill="#64748b">Retrieval Pipeline</text>

  <!-- Pipeline Stages -->
  <rect x="40" y="95" width="100" height="60" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="90" y="120" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Analyze</text>
  <text x="50" y="140" font-size="9" fill="#78350f">• Complexity</text>
  <text x="50" y="152" font-size="9" fill="#78350f">• Keywords</text>

  <path d="M 140 125 L 160 125" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <rect x="165" y="95" width="100" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="215" y="120" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Plan</text>
  <text x="175" y="140" font-size="9" fill="#1e3a8a">• Strategy</text>
  <text x="175" y="152" font-size="9" fill="#1e3a8a">• Algorithm</text>

  <path d="M 265 125 L 285 125" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <rect x="290" y="95" width="140" height="60" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="360" y="120" font-size="11" font-weight="600" fill="#7f1d1d" text-anchor="middle">Search</text>
  <text x="300" y="140" font-size="9" fill="#dc2626">• Beam/MCTS/Greedy</text>
  <text x="300" y="152" font-size="9" fill="#dc2626">• Tree Traversal</text>

  <path d="M 430 125 L 450 125" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <rect x="455" y="95" width="120" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="515" y="120" font-size="11" font-weight="600" fill="#6b21a8" text-anchor="middle">Judge</text>
  <text x="465" y="140" font-size="9" fill="#7e22ce">• Sufficiency</text>
  <text x="465" y="152" font-size="9" fill="#7e22ce">• Backtrack?</text>

  <!-- Pilot Box - The Brain -->
  <rect x="600" y="55" width="260" height="130" rx="10" fill="#1e293b" stroke="#374151" stroke-width="2"/>
  <text x="730" y="80" font-size="13" font-weight="700" fill="white" text-anchor="middle">🧠 Pilot</text>
  <text x="730" y="95" font-size="9" fill="#9ca3af" text-anchor="middle">The Brain of Retrieval</text>

  <!-- Pilot Components -->
  <rect x="615" y="105" width="70" height="35" rx="4" fill="#374151"/>
  <text x="650" y="122" font-size="8" fill="#9ca3af" text-anchor="middle">Budget</text>
  <text x="650" y="133" font-size="8" fill="white" text-anchor="middle">Controller</text>

  <rect x="695" y="105" width="70" height="35" rx="4" fill="#374151"/>
  <text x="730" y="122" font-size="8" fill="#9ca3af" text-anchor="middle">Context</text>
  <text x="730" y="133" font-size="8" fill="white" text-anchor="middle">Builder</text>

  <rect x="775" y="105" width="70" height="35" rx="4" fill="#374151"/>
  <text x="810" y="122" font-size="8" fill="#9ca3af" text-anchor="middle">Fallback</text>
  <text x="810" y="133" font-size="8" fill="white" text-anchor="middle">Manager</text>

  <rect x="615" y="145" width="160" height="30" rx="4" fill="#059669"/>
  <text x="695" y="165" font-size="9" fill="white" text-anchor="middle">LLM Client + Metrics</text>

  <!-- Intervention Points Section -->
  <rect x="20" y="265" width="860" height="180" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="40" y="290" font-size="12" font-weight="600" fill="#166534">Intervention Points (When Pilot Acts)</text>

  <!-- START -->
  <rect x="40" y="310" width="195" height="120" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="65" cy="335" r="12" fill="#22c55e"/>
  <text x="65" y="339" font-size="10" fill="white" text-anchor="middle">1</text>
  <text x="85" y="340" font-size="11" font-weight="600" fill="#166534">START</text>
  <text x="50" y="360" font-size="9" fill="#15803d">Before search begins</text>
  <text x="50" y="378" font-size="8" fill="#166534">• Analyze query intent</text>
  <text x="50" y="392" font-size="8" fill="#166534">• Identify target sections</text>
  <text x="50" y="406" font-size="8" fill="#166534">• Set initial direction</text>
  <text x="50" y="420" font-size="8" fill="#166534">• Provide entry points</text>

  <!-- FORK -->
  <rect x="250" y="310" width="195" height="120" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="275" cy="335" r="12" fill="#f59e0b"/>
  <text x="275" y="339" font-size="10" fill="white" text-anchor="middle">2</text>
  <text x="295" y="340" font-size="11" font-weight="600" fill="#92400e">FORK</text>
  <text x="260" y="360" font-size="9" fill="#b45309">At branch points</text>
  <text x="260" y="378" font-size="8" fill="#92400e">• Multiple children match</text>
  <text x="260" y="392" font-size="8" fill="#92400e">• Rank candidates</text>
  <text x="260" y="406" font-size="8" fill="#92400e">• Merge LLM + algo scores</text>
  <text x="260" y="420" font-size="8" fill="#92400e">• Guide path selection</text>

  <!-- BACKTRACK -->
  <rect x="460" y="310" width="195" height="120" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="485" cy="335" r="12" fill="#ef4444"/>
  <text x="485" y="339" font-size="10" fill="white" text-anchor="middle">3</text>
  <text x="505" y="340" font-size="11" font-weight="600" fill="#7f1d1d">BACKTRACK</text>
  <text x="470" y="360" font-size="9" fill="#dc2626">When search fails</text>
  <text x="470" y="378" font-size="8" fill="#7f1d1d">• Insufficient results</text>
  <text x="470" y="392" font-size="8" fill="#7f1d1d">• Suggest alternatives</text>
  <text x="470" y="406" font-size="8" fill="#7f1d1d">• Re-rank candidates</text>
  <text x="470" y="420" font-size="8" fill="#7f1d1d">• Adjust search params</text>

  <!-- EVALUATE -->
  <rect x="670" y="310" width="195" height="120" rx="6" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="695" cy="335" r="12" fill="#a855f7"/>
  <text x="695" y="339" font-size="10" fill="white" text-anchor="middle">4</text>
  <text x="715" y="340" font-size="11" font-weight="600" fill="#6b21a8">EVALUATE</text>
  <text x="680" y="360" font-size="9" fill="#7e22ce">After content found</text>
  <text x="680" y="378" font-size="8" fill="#6b21a8">• Check sufficiency</text>
  <text x="680" y="392" font-size="8" fill="#6b21a8">• Quality assessment</text>
  <text x="680" y="406" font-size="8" fill="#6b21a8">• Decide more data?</text>
  <text x="680" y="420" font-size="8" fill="#6b21a8">• Final confidence</text>

  <!-- Score Merging Section -->
  <rect x="20" y="460" width="420" height="110" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="485" font-size="11" font-weight="600" fill="#1e40af">Score Merging: Algorithm + LLM</text>

  <rect x="40" y="500" width="120" height="55" rx="4" fill="#dbeafe"/>
  <text x="100" y="520" font-size="10" font-weight="500" fill="#1e40af" text-anchor="middle">Algorithm Score</text>
  <text x="100" y="535" font-size="9" fill="#3b82f6" text-anchor="middle">Text similarity</text>
  <text x="100" y="548" font-size="9" fill="#3b82f6" text-anchor="middle">Heuristics</text>

  <text x="175" y="530" font-size="16" fill="#1e40af">+</text>

  <rect x="195" y="500" width="120" height="55" rx="4" fill="#fef3c7"/>
  <text x="255" y="520" font-size="10" font-weight="500" fill="#92400e" text-anchor="middle">LLM Score</text>
  <text x="255" y="535" font-size="9" fill="#f59e0b" text-anchor="middle">Semantic relevance</text>
  <text x="255" y="548" font-size="9" fill="#f59e0b" text-anchor="middle">Reasoning</text>

  <text x="330" y="530" font-size="16" fill="#1e40af">=</text>

  <rect x="350" y="500" width="70" height="55" rx="4" fill="#22c55e"/>
  <text x="385" y="520" font-size="10" font-weight="500" fill="white" text-anchor="middle">Final</text>
  <text x="385" y="535" font-size="10" font-weight="500" fill="white" text-anchor="middle">Score</text>

  <text x="230" y="575" font-size="9" fill="#64748b" text-anchor="middle">final = α × algo + β × llm (configurable weights)</text>

  <!-- Fallback Strategy Section -->
  <rect x="460" y="460" width="420" height="110" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="480" y="485" font-size="11" font-weight="600" fill="#991b1b">4-Level Fallback Strategy</text>

  <!-- Fallback Levels -->
  <rect x="480" y="500" width="90" height="55" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="525" y="520" font-size="9" font-weight="500" fill="#166534" text-anchor="middle">Normal</text>
  <text x="525" y="535" font-size="8" fill="#15803d" text-anchor="middle">LLM OK</text>
  <text x="525" y="548" font-size="8" fill="#15803d" text-anchor="middle">✓</text>

  <path d="M 575 527 L 590 527" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="595" y="500" width="90" height="55" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="640" y="520" font-size="9" font-weight="500" fill="#92400e" text-anchor="middle">Retry</text>
  <text x="640" y="535" font-size="8" fill="#b45309" text-anchor="middle">Backoff</text>
  <text x="640" y="548" font-size="8" fill="#b45309" text-anchor="middle">2x delay</text>

  <path d="M 690 527 L 705 527" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="710" y="500" width="90" height="55" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="755" y="520" font-size="9" font-weight="500" fill="#7f1d1d" text-anchor="middle">Simplified</text>
  <text x="755" y="535" font-size="8" fill="#dc2626" text-anchor="middle">Less tokens</text>
  <text x="755" y="548" font-size="8" fill="#dc2626" text-anchor="middle">Short ctx</text>

  <path d="M 805 527 L 820 527" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="825" y="500" width="45" height="55" rx="4" fill="#1e293b"/>
  <text x="847" y="520" font-size="8" font-weight="500" fill="white" text-anchor="middle">Algo</text>
  <text x="847" y="535" font-size="8" fill="#9ca3af" text-anchor="middle">Only</text>

  <text x="670" y="575" font-size="9" fill="#64748b" text-anchor="middle">Automatic escalation on consecutive failures</text>

  <!-- Design Philosophy -->
  <rect x="20" y="585" width="860" height="75" rx="8" fill="#1e293b"/>
  <text x="450" y="610" font-size="11" font-weight="600" fill="white" text-anchor="middle">Design Philosophy</text>

  <text x="150" y="635" font-size="10" fill="#9ca3af" text-anchor="middle">Algorithm = "How to search"</text>
  <text x="150" y="650" font-size="9" fill="#6b7280" text-anchor="middle">Efficient, deterministic</text>

  <text x="450" y="635" font-size="10" fill="#9ca3af" text-anchor="middle">Pilot = "Where to go"</text>
  <text x="450" y="650" font-size="9" fill="#6b7280" text-anchor="middle">Semantic understanding, direction</text>

  <text x="750" y="635" font-size="10" fill="#9ca3af" text-anchor="middle">Intervention at key points</text>
  <text x="750" y="650" font-size="9" fill="#6b7280" text-anchor="middle">Not every step, only when needed</text>

  <!-- Pilot to Pipeline Connections -->
  <path d="M 600 120 L 575 120" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <path d="M 730 185 L 730 220 L 360 220 L 360 155" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Backtrack connection -->
  <path d="M 515 155 L 515 175 L 360 175 L 360 155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="430" y="188" font-size="8" fill="#dc2626" text-anchor="middle">Backtrack with Pilot guidance</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
