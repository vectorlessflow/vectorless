<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the main shape -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>

    <!-- Gradient for accent -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Background circle (optional, for contrast) -->
  <circle cx="100" cy="100" r="95" fill="#f8fafc"/>

  <!-- Main V shape representing tree structure -->
  <!-- Left branch of V -->
  <path d="M 40 50 L 100 100 L 100 95 L 45 55 Z" fill="url(#mainGradient)"/>

  <!-- Right branch of V -->
  <path d="M 160 50 L 100 100 L 100 95 L 155 55 Z" fill="url(#mainGradient)"/>

  <!-- Tree nodes on the V -->
  <circle cx="40" cy="50" r="8" fill="url(#mainGradient)"/>
  <circle cx="160" cy="50" r="8" fill="url(#mainGradient)"/>
  <circle cx="100" cy="100" r="10" fill="url(#mainGradient)"/>

  <!-- Navigation path (the "reasoning" aspect) -->
  <path d="M 100 100 L 70 130 L 50 160"
        stroke="url(#accentGradient)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Path endpoint (result) -->
  <circle cx="50" cy="160" r="6" fill="url(#accentGradient)"/>

  <!-- Small branches suggesting tree structure -->
  <line x1="70" y1="75" x2="55" y2="65" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="75" x2="145" y2="65" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

  <!-- Small node hints -->
  <circle cx="55" cy="65" r="3" fill="#60a5fa"/>
  <circle cx="145" cy="65" r="3" fill="#60a5fa"/>
</svg>
