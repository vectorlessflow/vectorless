<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="200" height="200" rx="24" fill="#0f172a"/>

  <!-- V shape with branches -->
  <path d="M 38 44 L 100 120 L 162 44" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Tree trunk/navigation path -->
  <path d="M 100 120 L 100 162" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>

  <!-- Top Nodes -->
  <circle cx="38" cy="44" r="14" fill="url(#g)"/>
  <circle cx="162" cy="44" r="14" fill="url(#g)"/>

  <!-- Center Node -->
  <circle cx="100" cy="120" r="18" fill="url(#g)"/>

  <!-- Result Node -->
  <circle cx="100" cy="162" r="11" fill="#34d399"/>
</svg>
