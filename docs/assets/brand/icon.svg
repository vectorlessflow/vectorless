<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- V shape with branches -->
  <path d="M 12 14 L 32 38 L 52 14" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Tree trunk/navigation path -->
  <path d="M 32 38 L 32 52" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>

  <!-- Top Nodes -->
  <circle cx="12" cy="14" r="4.5" fill="url(#g)"/>
  <circle cx="52" cy="14" r="4.5" fill="url(#g)"/>

  <!-- Center Node -->
  <circle cx="32" cy="38" r="6" fill="url(#g)"/>

  <!-- Result Node -->
  <circle cx="32" cy="52" r="3.5" fill="#10b981"/>
</svg>
